{% extends 'registration/auth_base.html' %}
{% block title %}找回密码 - {{ platform_name }}{% endblock %}
{% block auth_content %}<span class="kb-eyebrow">ACCOUNT & SECURITY</span><h1 id="authTitle">找回密码</h1><p class="kb-auth-description">输入账号关联的邮箱。此功能需要管理员配置邮件服务。</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}<div class="kb-auth-field"><label for="id_email">电子邮箱</label><div class="kb-auth-input"><i class="bi bi-envelope" aria-hidden="true"></i><input type="email" name="email" id="id_email" autocomplete="email" required></div>{{ form.email.errors }}</div><button type="submit" class="btn btn-primary kb-auth-submit">发送重置链接</button></form><p class="kb-auth-note"><a href="{% url 'login' %}">返回登录</a></p>{% endblock %}
