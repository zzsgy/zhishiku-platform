<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 智识库</title></head><body>
<main style="max-width:360px;margin:10vh auto;font:16px/1.8 system-ui;padding:24px"><h1>登录智识库</h1>
{% if form.errors %}<p role="alert">用户名或密码不正确，请重试。</p>{% endif %}
<form method="post">{% csrf_token %}<label for="id_username">用户名</label>{{ form.username }}<br><label for="id_password">密码</label>{{ form.password }}
<input type="hidden" name="next" value="{{ next }}"><p><button type="submit">登录</button></p></form></main></body></html>
