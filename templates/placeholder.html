{% extends 'base.html' %}
{% block title %}{{ title }} - {{ platform_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body text-center py-5">
        <i class="bi bi-hammer display-1 text-primary"></i>
        <h2 class="mt-3">{{ title }}</h2>
        <p class="text-muted">{{ desc }}</p>
        <span class="badge bg-warning text-dark">模块建设中</span>
      </div>
    </div>
  </div>
</div>
{% endblock %}
