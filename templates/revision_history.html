{% extends 'base.html' %}{% block content %}<h1>{{ node.title }} · 修订历史</h1>
<p>当前版本 {{ node.version }}。恢复历史会生成新的修订，当前正文仍可找回。</p>
{% for r in revisions %}<details><summary>版本 {{ r.version }} · {{ r.created }}</summary><pre style="white-space:pre-wrap">{{ r.snapshot.content_md }}</pre>
<form method="post">{% csrf_token %}<input type="hidden" name="version" value="{{ node.version }}"><button name="revision" value="{{ r.pk }}">恢复此版本</button></form></details>
{% empty %}<p>尚无历史修订。</p>{% endfor %}{% endblock %}
