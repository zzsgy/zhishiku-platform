{% if page_obj %}<nav aria-label="分页" class="d-flex gap-3 align-items-center my-3">
<span>共 {{ page_obj.paginator.count }} 条 · 第 {{ page_obj.number }}/{{ page_obj.paginator.num_pages }} 页</span>
{% if page_obj.has_previous %}<a href="?{{ page_obj.query_prefix }}&{{ page_obj.parameter }}={{ page_obj.previous_page_number }}">上一页</a>{% endif %}
{% if page_obj.has_next %}<a href="?{{ page_obj.query_prefix }}&{{ page_obj.parameter }}={{ page_obj.next_page_number }}">下一页</a>{% endif %}
</nav>{% endif %}
